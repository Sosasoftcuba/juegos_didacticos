<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Ejercicio 6 · Ortografía contextualizada · Lengua Española</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:#eef2f7; font-family:'Segoe UI',Roboto,system-ui,sans-serif; padding:clamp(0.75rem,2.5vw,1.5rem); min-height:100vh; display:flex; justify-content:center; align-items:center; }
        .container { max-width:1100px; width:100%; background:white; border-radius:2rem; box-shadow:0 25px 45px -12px rgba(0,0,0,0.3); overflow:hidden; border-top:6px solid #ce1126; border-bottom:6px solid #002a8f; }
        .header { background:linear-gradient(135deg,#1e3a5f,#0f2c44); color:white; padding:1.2rem clamp(1rem,4vw,2rem); text-align:center; }
        .header h1 { font-size:clamp(1.3rem,6vw,1.9rem); }
        .level-bar { padding:0.8rem clamp(1rem,3vw,2rem); display:flex; gap:0.6rem; flex-wrap:wrap; justify-content:center; background:#f4f7fc; }
        .level-btn { padding:0.4rem 1rem; font-size:clamp(0.7rem,3.5vw,0.9rem); border:none; border-radius:2rem; cursor:pointer; font-weight:bold; background:#e2e8f0; transition:0.2s; }
        .level-btn.active { background:#ce1126; color:white; }
        .quiz-area { padding:1.5rem clamp(1rem,3vw,2rem); }
        .question { background:#fef9ef; margin-bottom:1.5rem; padding:1rem; border-radius:1.2rem; border-left:5px solid #ce1126; }
        .question-text { font-weight:bold; font-size:1rem; margin-bottom:0.8rem; }
        .options { display:flex; flex-direction:column; gap:0.6rem; margin-left:0.8rem; }
        .option { display:flex; align-items:center; gap:0.8rem; cursor:pointer; background:white; padding:0.4rem 0.8rem; border-radius:2rem; border:1px solid #ddd; transition:0.1s; }
        .option:hover { background:#ffecb3; }
        button { background:#002a8f; color:white; border:none; padding:0.7rem 1.2rem; border-radius:2rem; font-weight:bold; font-size:1rem; cursor:pointer; width:100%; margin-top:1rem; }
        .result-panel { background:#f0f4fa; border-radius:1.2rem; padding:1rem; margin-top:1.2rem; }
        .ai-message { background:#e9f0fa; border-radius:1rem; padding:0.8rem; margin-top:1rem; font-size:0.85rem; border-left:4px solid #ce1126; }
        footer { background:#1e2f3c; color:#cddce9; text-align:center; padding:0.9rem; font-size:0.75rem; }
        .game-nav { display:flex; justify-content:center; gap:1rem; flex-wrap:wrap; margin:1rem; padding-top:0.5rem; border-top:1px solid #ccc; }
        .game-nav button { background:#2c5282; width:auto; margin:0; padding:0.4rem 1rem; font-size:0.8rem; }
        @media (max-width:600px){ .options { margin-left:0; } }
        @media (orientation:landscape) and (max-height:550px){ .question { margin-bottom:0.8rem; padding:0.6rem; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>✍️ Ortografía contextualizada</h1>
        <p>Tildes, puntuación y corrección en textos literarios</p>
    </div>
    <div class="level-bar" id="levelBar">
        <button class="level-btn active" data-level="0">🌟 Fácil (4 preguntas)</button>
        <button class="level-btn" data-level="1">📘 Normal (6 preguntas)</button>
        <button class="level-btn" data-level="2">🔥 Difícil (8 preguntas)</button>
    </div>
    <div class="quiz-area" id="quizArea"></div>
    <div class="game-nav">
        <button onclick="location.href='index.html'">🏠 Volver al inicio</button>
        <button onclick="location.href='Juego_05.html'">◀ Anterior</button>
        <button onclick="location.href='Juego_07.html'">Siguiente ▶</button>
    </div>
    <footer>🤖 IA educativa · Aprende ortografía con fragmentos literarios cubanos</footer>
</div>

<script>
    // ==================== BANCO DE PREGUNTAS DE ORTOGRAFÍA CONTEXTUALIZADA ====================
    const bancoPreguntas = [
        { // 0
            texto: "En el verso ‘Y en el cielo ( ) las estrellas brillan...’ ¿qué signo de puntuación falta tras ‘cielo’ si hay una pausa breve?",
            opciones: ["Coma (,)", "Punto y coma (;)", "Dos puntos (:)", "Ninguno"],
            correcta: "A",
            explicacion: "La coma indica una pausa breve dentro del verso."
        },
        { // 1
            texto: "Selecciona la palabra correctamente tildada: ‘...aquel hombre ( ) sincero como un árbol...’",
            opciones: ["eterno", "etérno", "etèrno", "eternó"],
            correcta: "A",
            explicacion: "‘Eterno’ es palabra grave terminada en vocal, no lleva tilde."
        },
        { // 2
            texto: "¿Cuál es la forma correcta de escribir el apellido del Apóstol cubano?",
            opciones: ["Marti", "Martí", "Márti", "Martì"],
            correcta: "B",
            explicacion: "‘Martí’ lleva tilde en la i porque es palabra aguda terminada en vocal."
        },
        { // 3
            texto: "Elige la opción con acento correcto: ‘...la poesia es un arma cargada de futuro’",
            opciones: ["poesia", "poesía", "poesía (sin tilde)", "póesia"],
            correcta: "B",
            explicacion: "‘Poesía’ tiene hiato y la i débil lleva tilde."
        },
        { // 4
            texto: "¿Cuál frase usa correctamente los signos de interrogación?",
            opciones: ["¿Quién dijo: “La patria es ara”?", "Quién dijo “La patria es ara”?", "¿Quién dijo “La patria es ara”?", "¡Quién dijo “La patria es ara”!"],
            correcta: "C",
            explicacion: "Los signos de interrogación deben abrir y cerrar la oración interrogativa."
        },
        { // 5
            texto: "Oración: ‘...los niños ( ) los ancianos esperan la luz.’ ¿Qué signo falta?",
            opciones: ["Coma", "Punto", "Coma después de ancianos", "Ninguno"],
            correcta: "A",
            explicacion: "La coma separa sujetos múltiples en estructuras literarias."
        },
        { // 6
            texto: "Escoge la opción correcta: ‘El poeta ( ) dedicó su obra a la libertad.’ (pronombre vs artículo)",
            opciones: ["se", "sé", "se (sin tilde)", "sé con tilde"],
            correcta: "A",
            explicacion: "‘Se’ es pronombre sin tilde. ‘Sé’ es del verbo saber o ser."
        },
        { // 7
            texto: "¿Cuál opción respeta las mayúsculas después de punto?",
            opciones: ["Llegó la noche. todo quedó en calma.", "Llegó la noche. Todo quedó en calma.", "Llegó la noche. todo quedó en calma.", "Llegó la noche. Todo quedó en Calma."],
            correcta: "B",
            explicacion: "Después de punto y seguido o aparte, la primera letra debe ser mayúscula."
        }
    ];

    const niveles = {
        0: { preguntas: bancoPreguntas.slice(0,4), nombre: "Fácil" },
        1: { preguntas: bancoPreguntas.slice(0,6), nombre: "Normal" },
        2: { preguntas: bancoPreguntas.slice(0,8), nombre: "Difícil" }
    };

    let currentLevel = 0;
    let respuestasUsuario = {};

    function renderQuiz() {
        const nivelData = niveles[currentLevel];
        const preguntas = nivelData.preguntas;
        const area = document.getElementById('quizArea');
        let html = `<form id="quizForm">`;
        preguntas.forEach((p, idx) => {
            const letras = ['A','B','C','D'];
            html += `<div class="question"><div class="question-text">${idx+1}. ${p.texto}</div><div class="options">`;
            p.opciones.forEach((opt, optIdx) => {
                const letra = letras[optIdx];
                const checked = (respuestasUsuario[idx] === letra) ? 'checked' : '';
                html += `<label class="option"><input type="radio" name="q${idx}" value="${letra}" ${checked}><strong>${letra}.</strong> ${opt}</label>`;
            });
            html += `</div><div id="expli-${idx}" style="font-size:0.85rem; margin-top:8px; color:#2c5282;"></div></div>`;
        });
        html += `<button type="button" id="calificarBtn">✅ Calificar y ver explicaciones</button></form>
                 <div id="resultadoPanel" class="result-panel"></div>
                 <div class="ai-message" id="aiMessage">💡 Haz clic en 'Calificar' para recibir retroalimentación de la IA.</div>`;
        area.innerHTML = html;

        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const name = e.target.name;
                const idx = parseInt(name.substring(1));
                respuestasUsuario[idx] = e.target.value;
            });
        });

        document.getElementById('calificarBtn')?.addEventListener('click', () => calificar(preguntas));
    }

    function calificar(preguntas) {
        let aciertos = 0;
        const total = preguntas.length;
        for (let i = 0; i < total; i++) {
            const p = preguntas[i];
            const userResp = respuestasUsuario[i];
            const esCorrecto = (userResp === p.correcta);
            if (esCorrecto) aciertos++;
            const explDiv = document.getElementById(`expli-${i}`);
            if (explDiv) {
                explDiv.innerHTML = esCorrecto 
                    ? `✅ Correcto. ${p.explicacion}` 
                    : `❌ Incorrecto. Respuesta correcta: ${p.correcta}. ${p.explicacion} Tu respuesta: ${userResp || '(sin responder)'}`;
            }
        }
        const porcentaje = Math.round((aciertos/total)*100);
        const panel = document.getElementById('resultadoPanel');
        panel.innerHTML = `<h3 style="color:#002a8f">📊 Puntuación: ${aciertos}/${total} (${porcentaje}%)</h3>
                           <p>${porcentaje >= 70 ? '¡Muy bien! La ortografía es clave en la expresión escrita.' : 'Revisa las explicaciones para mejorar tus reglas ortográficas.'}</p>`;
        const msgDiv = document.getElementById('aiMessage');
        msgDiv.innerHTML = `🤖 IA: ${aciertos === total ? '¡Perfecto! Dominas la ortografía contextualizada.' : 'Sigue practicando con textos literarios. Cada regla tiene su lógica.'}`;
    }

    function setLevel(level) {
        currentLevel = level;
        respuestasUsuario = {};
        renderQuiz();
        document.querySelectorAll('.level-btn').forEach(btn => {
            if (parseInt(btn.getAttribute('data-level')) === level) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        adaptativeScreen();
    }

    document.querySelectorAll('.level-btn').forEach(btn => {
        btn.addEventListener('click', () => setLevel(parseInt(btn.getAttribute('data-level'))));
    });

    function adaptativeScreen() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        if (width < 480) document.body.style.padding = '0.6rem';
        else if (width < 768) document.body.style.padding = '1rem';
        else document.body.style.padding = '1.5rem';
        
        const questions = document.querySelectorAll('.question');
        if (height < 550 && width > height) {
            questions.forEach(q => q.style.marginBottom = '0.8rem');
        } else {
            questions.forEach(q => q.style.marginBottom = '1.5rem');
        }
    }
    window.addEventListener('resize', adaptativeScreen);
    window.addEventListener('orientationchange', () => setTimeout(adaptativeScreen, 30));

    setLevel(0);
    adaptativeScreen();
</script>
</body>
</html>
