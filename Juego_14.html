<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Ejercicio 14 · Línea del tiempo · Poesía cubana</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:#eef2f7; font-family:'Segoe UI',Roboto,system-ui,sans-serif; padding:clamp(0.75rem,2.5vw,1.5rem); min-height:100vh; display:flex; justify-content:center; align-items:center; }
        .container { max-width:1300px; width:100%; background:white; border-radius:2rem; box-shadow:0 25px 45px -12px rgba(0,0,0,0.3); overflow:hidden; border-top:6px solid #ce1126; border-bottom:6px solid #002a8f; }
        .header { background:linear-gradient(135deg,#1e3a5f,#0f2c44); color:white; padding:1.2rem clamp(1rem,4vw,2rem); text-align:center; }
        .header h1 { font-size:clamp(1.3rem,6vw,1.9rem); }
        .level-bar { padding:0.8rem clamp(1rem,3vw,2rem); display:flex; gap:0.6rem; flex-wrap:wrap; justify-content:center; background:#f4f7fc; }
        .level-btn { padding:0.4rem 1rem; font-size:clamp(0.7rem,3.5vw,0.9rem); border:none; border-radius:2rem; cursor:pointer; font-weight:bold; background:#1e40af; color:white; transition:0.2s; }
        .level-btn.active { background:#ce1126; color:white; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
        .timeline-area { padding:1.5rem; }
        .timeline-layout { display:flex; flex-wrap:wrap; gap:2rem; justify-content:center; }
        .available-list { flex:1; min-width:250px; background:#f8f2e0; border-radius:1.5rem; padding:1rem; }
        .available-list h3 { margin-bottom:0.5rem; color:#1e3a5f; }
        .event-buttons { display:flex; flex-direction:column; gap:0.6rem; }
        .event-btn { background:#1e40af; color:white; border:none; border-radius:2rem; padding:0.6rem 1rem; text-align:left; cursor:pointer; transition:0.1s; font-weight:500; }
        .event-btn:hover { background:#3b5fdf; transform:scale(1.01); }
        .timeline-slots { flex:2; min-width:300px; background:#fef9ef; border-radius:1.5rem; padding:1rem; }
        .timeline-slots h3 { margin-bottom:0.5rem; color:#1e3a5f; }
        .slots-container { display:flex; flex-direction:column; gap:0.8rem; }
        .slot { background:#e9ecef; border:2px dashed #002a8f; border-radius:1rem; padding:0.8rem; transition:0.1s; }
        .slot.filled { background:#d4edda; border:2px solid #2e8b57; }
        .slot span { font-weight:bold; color:#2c5282; }
        .slot .event-info { margin-top:0.3rem; font-size:0.9rem; }
        .slot.empty { color:#6c757d; text-align:center; }
        .control-panel { padding:1rem; display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:1rem; }
        button { background:#1e40af; color:white; border:none; padding:0.5rem 1rem; border-radius:2rem; font-weight:bold; cursor:pointer; touch-action:manipulation; }
        .feedback { background:#f0f4fa; margin:1rem; padding:0.8rem; border-radius:1rem; font-size:0.85rem; }
        footer { background:#1e2f3c; color:white; text-align:center; padding:0.7rem; font-size:0.7rem; }
        .game-nav { display:flex; justify-content:center; gap:1rem; flex-wrap:wrap; margin:1rem; padding-top:0.5rem; border-top:1px solid #ccc; }
        .game-nav button { background:#1e40af; width:auto; margin:0; padding:0.4rem 1rem; font-size:0.8rem; }
        @media (max-width:800px){ .timeline-layout { flex-direction:column; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📜 Línea del tiempo · Poesía cubana</h1>
        <p>Haz clic en los eventos en orden cronológico (del más antiguo al más reciente)</p>
    </div>
    <div class="level-bar" id="levelBar">
        <button class="level-btn active" data-level="0">🌟 Fácil (5 eventos)</button>
        <button class="level-btn" data-level="1">📘 Normal (8 eventos)</button>
        <button class="level-btn" data-level="2">🔥 Difícil (12 eventos)</button>
    </div>
    <div class="timeline-area" id="timelineArea"></div>
    <div class="control-panel">
        <button id="resetBtn">🔄 Reiniciar nivel</button>
    </div>
    <div id="feedback" class="feedback"></div>
    <div class="game-nav">
        <button onclick="location.href='index.html'">🏠 Volver al inicio</button>
        <button onclick="location.href='Juego_13.html'">◀ Anterior</button>
        <button onclick="location.href='Juego_15.html'">Siguiente ▶</button>
    </div>
    <footer>🤖 IA: retroalimentación histórica automática · Poesía cubana desde el siglo XVII hasta la actualidad</footer>
</div>

<script>
    const todosEventos = [
        { nombre: "Silvestre de Balboa escribe 'Espejo de paciencia'", año: 1608, desc: "Primer poema épico cubano, narra el rescate de un obispo." },
        { nombre: "Nacimiento de José María Heredia", año: 1803, desc: "Precursor del romanticismo en América, autor de 'En el teocalli de Cholula'." },
        { nombre: "Gertrudis Gómez de Avellaneda escribe 'Al partir'", año: 1840, desc: "Poema romántico de la gran poetisa cubana." },
        { nombre: "Plácido (Gabriel de la Concepción) es fusilado", año: 1844, desc: "Poeta mulato, símbolo de la represión colonial." },
        { nombre: "Nacimiento de José Martí", año: 1853, desc: "Héroe nacional, modernista. 'Versos sencillos' es su obra más universal." },
        { nombre: "Martí publica 'Ismaelillo'", año: 1882, desc: "Primer libro de poesía modernista cubano, dedicado a su hijo." },
        { nombre: "Julián del Casal publica 'Hojas al viento'", año: 1892, desc: "Máximo exponente del modernismo cubano, poesía melancólica." },
        { nombre: "Nacimiento de Nicolás Guillén", año: 1902, desc: "Poeta de la negritud, autor de 'Motivos de son'." },
        { nombre: "Nacimiento de José Lezama Lima", año: 1910, desc: "Poeta y novelista neobarroco, fundador del grupo Orígenes." },
        { nombre: "Nicolás Guillén publica 'Motivos de son'", año: 1930, desc: "Libro fundacional de la poesía negra hispanoamericana." },
        { nombre: "Dulce María Loynaz publica 'Jardín'", año: 1951, desc: "Poemario intimista, Premio Cervantes 1992." },
        { nombre: "Nancy Morejón publica 'Mujer negra'", año: 1975, desc: "Poema emblemático de la identidad afrocubana." }
    ];

    const nivelesEventos = {
        0: todosEventos.filter((_, idx) => [0,2,4,7,9].includes(idx)),
        1: todosEventos.filter((_, idx) => [0,2,3,4,5,7,9,10].includes(idx)),
        2: todosEventos.slice()
    };

    for (let level in nivelesEventos) {
        nivelesEventos[level].sort((a,b) => a.año - b.año);
    }

    let currentLevel = 0;
    let eventosOriginales = [];
    let eventosDesordenados = [];
    let ordenUsuario = [];
    let gameCompleted = false;

    const timelineArea = document.getElementById('timelineArea');
    const feedbackDiv = document.getElementById('feedback');

    function mezclarArray(arr) {
        const copia = [...arr];
        for (let i = copia.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copia[i], copia[j]] = [copia[j], copia[i]];
        }
        return copia;
    }

    function resetLevel() {
        eventosOriginales = [...nivelesEventos[currentLevel]];
        eventosOriginales.sort((a,b) => a.año - b.año);
        eventosDesordenados = mezclarArray(eventosOriginales);
        ordenUsuario = new Array(eventosOriginales.length).fill(null);
        gameCompleted = false;
        renderTimeline();
        feedbackDiv.innerHTML = '';
    }

    function renderTimeline() {
        let html = `<div class="timeline-layout">
                        <div class="available-list">
                            <h3>📦 Eventos por colocar (clic para poner en orden)</h3>
                            <div class="event-buttons" id="eventButtons">`;
        eventosDesordenados.forEach((ev, idx) => {
            const yaColocado = ordenUsuario.includes(idx);
            if (!yaColocado) {
                html += `<button class="event-btn" data-event-idx="${idx}">${ev.nombre} <small>(${ev.año})</small></button>`;
            }
        });
        html += `</div></div><div class="timeline-slots"><h3>📅 Línea cronológica (orden correcto)</h3><div class="slots-container" id="slotsContainer">`;
        for (let i = 0; i < eventosOriginales.length; i++) {
            const slotEventIdx = ordenUsuario[i];
            const expectedEvent = eventosOriginales[i];
            if (slotEventIdx !== null) {
                const ev = eventosDesordenados[slotEventIdx];
                html += `<div class="slot filled">
                            <span>Posición ${i+1} (año ${expectedEvent.año})</span>
                            <div class="event-info">✅ ${ev.nombre} (${ev.año})</div>
                         </div>`;
            } else {
                html += `<div class="slot empty">
                            <span>Posición ${i+1} (año ${expectedEvent.año})</span>
                            <div class="event-info">⬅️ Esperando evento</div>
                         </div>`;
            }
        }
        html += `</div></div></div>`;
        timelineArea.innerHTML = html;

        document.querySelectorAll('.event-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (gameCompleted) {
                    feedbackDiv.innerHTML = "🎉 ¡Ya completaste el nivel! Reinicia para volver a jugar.";
                    return;
                }
                const eventIdx = parseInt(btn.dataset.eventIdx);
                const evento = eventosDesordenados[eventIdx];
                const nextEmptySlot = ordenUsuario.findIndex(slot => slot === null);
                if (nextEmptySlot === -1) {
                    feedbackDiv.innerHTML = "Ya no hay espacios vacíos. Reinicia el nivel si quieres intentar de nuevo.";
                    return;
                }
                const expectedEvent = eventosOriginales[nextEmptySlot];
                if (evento.año === expectedEvent.año && evento.nombre === expectedEvent.nombre) {
                    ordenUsuario[nextEmptySlot] = eventIdx;
                    feedbackDiv.innerHTML = `✅ ¡Correcto! "${evento.nombre}" (${evento.año}) es el siguiente en la cronología.`;
                    if (ordenUsuario.every(slot => slot !== null)) {
                        gameCompleted = true;
                        feedbackDiv.innerHTML = `🎉 ¡Felicidades! Has completado la línea de tiempo de la poesía cubana. ${eventosOriginales.length} eventos ordenados correctamente.`;
                    }
                    renderTimeline();
                } else {
                    feedbackDiv.innerHTML = `❌ Incorrecto. "${evento.nombre}" (${evento.año}) no corresponde aquí. El siguiente evento esperado es "${expectedEvent.nombre}" (${expectedEvent.año}). Vuelve a intentarlo.`;
                }
            });
        });
    }

    function setLevel(level) {
        currentLevel = level;
        resetLevel();
        document.querySelectorAll('.level-btn').forEach(btn => {
            if (parseInt(btn.dataset.level) === level) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        adaptativeScreen();
    }

    document.getElementById('resetBtn').addEventListener('click', resetLevel);
    document.querySelectorAll('.level-btn').forEach(btn => {
        btn.addEventListener('click', () => setLevel(parseInt(btn.dataset.level)));
    });

    function adaptativeScreen() {
        const width = window.innerWidth;
        if (width < 480) document.body.style.padding = '0.6rem';
        else if (width < 768) document.body.style.padding = '1rem';
        else document.body.style.padding = '1.5rem';
    }
    window.addEventListener('resize', adaptativeScreen);
    window.addEventListener('orientationchange', () => setTimeout(adaptativeScreen, 30));

    setLevel(0);
    adaptativeScreen();
</script>
</body>
</html>
